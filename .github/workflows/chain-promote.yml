# ENG-1944 test (temporary): started by "chain deploy" on a cronos runner, whose tracer
# reports the run that started it.
name: chain promote
on:
  workflow_run:
    workflows: ["chain deploy"]
    types: [completed]
jobs:
  promote:
    runs-on: cronos
    steps:
      - run: echo "promoting (GitHub stamped this run ${GITHUB_SHA})"; sleep 45
